name: Memecoin's Frontend Interface Deploy

on:
  push:
    branches:
      - main
    paths:
      - interface/frontend/**
  workflow_dispatch:
    inputs:
      path:
        description: "Path to deploy"
        required: true
        default: "interface/frontend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Tailscale Login
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_CI_TAG }}

      - name: SCP to VPS
        working-directory: interface/frontend
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: |
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o User=$VPS_USERNAME -pr * $VPS_USERNAME@$VPS_IP:/var/www/memecoins/

      - name: SCP to Node
        working-directory: interface/frontend
        env:
          NODE_IP: ${{ secrets.NODE_IP }}
          NODE_USERNAME: ${{ vars.NODE_USERNAME }}
        run: |
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o User=$NODE_USERNAME -pr * $NODE_USERNAME@$NODE_IP:/home/rebelforce/scripts/memecoin_page/
          ssh $SSH_OPTS $NODE_IP "cd /home/rebelforce/scripts/memecoin_trading/ && git pull origin main"
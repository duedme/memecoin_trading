name: Memecoin's Frontend Interface Deploy

on:
    push:
        branches:
            - main
        paths:
            - interface/frontend

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Tailscale Login
              uses: tailscale/github-action@v4
              with:
                oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                oauth-secret: ${{ secrets.TS_OAUTH_SECRET}}
                tags: ${{ vars.TS_CI_TAG }}

            - name: SCP to VPS
              working-directory: interface/frontend
              env:
                VPS_IP: ${{ secrets.VPS_IP }}
                VPS_USERNAME: ${{ vars.VPS_USERNAME }}
              run: |
                scp -pr * $VPS_USERNAME@$VPS_IP:/var/www/memecoins/

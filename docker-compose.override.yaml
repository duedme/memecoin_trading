services:
  chain-listener:
    build:
      context: ./memecoin_detecting
      dockerfile: ./docker/Dockerfile
    restart: always
    env_file: [./.memecoin_detecting.env]
    network_mode: host
    depends_on:
      db: { condition: service_healthy }
    command: ["python3", "chain_listener.py"]

  tx-parser:
    build:
      context: ./memecoin_detecting
      dockerfile: ./docker/Dockerfile

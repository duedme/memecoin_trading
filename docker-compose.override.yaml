    command: ["python3", "maintenance_worker.py"]

  # Legacy neutralizado (se elimina del compose base en próximo release)
  metricscollector:
    image: alpine:3.19
    command: ["true"]
    restart: "no"

  walletclassifier:
    image: alpine:3.19
    command: ["true"]
    restart: "no"
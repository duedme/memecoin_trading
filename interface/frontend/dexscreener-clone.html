<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memecoin Screener</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Bar -->
    <div class="topbar">
        <div class="logo">🔍 <span>Memecoin</span>Screener</div>

        <!-- View Switcher -->
        <div class="view-switcher">
            <button class="view-btn active" data-view="traders" id="btnTraders">👑 Top Traders</button>
            <button class="view-btn" data-view="tokens" id="btnTokens">🪙 Tokens</button>
        </div>

        <input type="text" class="search-box" id="searchBox" placeholder="Buscar...">

        <div class="stats-bar" id="statsBar">
            <span class="stat-item" id="statTokens">— tokens</span>
            <span class="stat-item" id="statWallets">— wallets</span>
            <span class="stat-item" id="statTxns">— txns/24h</span>
            <span class="stat-item" id="statClassifications">— classified</span>
        </div>
    </div>

    <!-- Sub-filters -->
    <div class="subfilters" id="subfilters">
        <!-- Se llenan dinámicamente desde JS -->
    </div>

    <!-- Table -->
    <div class="table-container">
        <table id="mainTable">
            <thead id="tableHead">
                <!-- Se llena dinámicamente -->
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="13" style="text-align:center; padding:40px; color:#5c5e64">
                        Cargando datos...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <span id="connectionStatus"><span class="status-dot"></span> Conectando...</span>
        <span id="lastUpdate">Última actualización: —</span>
    </div>

    <script src="app.js"></script>
</body>
</html>

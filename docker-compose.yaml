services:
  # ===== Postgres + TimescaleDB =====
  db:
    image: timescale/timescaledb:latest-pg16
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./memecoin_detecting/scripts/01-schema-master.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ===== API Server =====
  api-server:
    build:
      context: ./interface/backend
      dockerfile: Dockerfile
    restart: always
    env_file: ./memecoin_detecting/.env
    environment:
      - DB_HOST=db
    ports:
      - "8200:8200"
    depends_on:
      db:
        condition: service_healthy

  # ===== Ingesta de Transacciones (Geyser) =====
  geyser-tx-worker:
    build:
      context: ./memecoin_detecting
      dockerfile: docker/Dockerfile
    restart: always
    env_file: [./memecoin_detecting/.env]
    environment:
      - DB_HOST=db
    volumes:
      - ./memecoin_detecting/src:/app
    depends_on:
      db: { condition: service_healthy }
    command: ["python3", "geyser_tx_worker.py"]

  # ===== Actualizador de Precios (Geyser) =====
  geyser-price-updater:
    build:
      context: ./memecoin_detecting
      dockerfile: docker/Dockerfile
    restart: always
    env_file: [./memecoin_detecting/.env]
    environment:
      - DB_HOST=db
    volumes:
      - ./memecoin_detecting/src:/app
    depends_on:
      db: { condition: service_healthy }
    command: ["python3", "geyser_price_updater.py"]

  # ===== Reducers y Mantenimiento (Iguales, pero unificados aquí) =====
  position-reducer:
    build: { context: ./memecoin_detecting, dockerfile: docker/Dockerfile }
    restart: always
    env_file: [./memecoin_detecting/.env]
    network_mode: host
    depends_on: { db: { condition: service_healthy } }
    command: ["python3", "position_reducer.py"]

  wallet-reducer:
    build: { context: ./memecoin_detecting, dockerfile: docker/Dockerfile }
    restart: always
    env_file: [./memecoin_detecting/.env]
    network_mode: host
    depends_on: { db: { condition: service_healthy } }
    command: ["python3", "wallet_reducer.py"]

  token-trader-reducer:
    build: { context: ./memecoin_detecting, dockerfile: docker/Dockerfile }
    restart: always
    env_file: [./memecoin_detecting/.env]
    network_mode: host
    depends_on: { db: { condition: service_healthy } }
    command: ["python3", "token_trader_reducer.py"]

  market-collector:
    build: { context: ./memecoin_detecting, dockerfile: docker/Dockerfile }
    restart: always
    env_file: [./memecoin_detecting/.env]
    network_mode: host
    depends_on: { db: { condition: service_healthy } }
    command: ["python3", "market_collector.py"]

  classifier-worker:
    build: { context: ./memecoin_detecting, dockerfile: docker/Dockerfile }
    restart: always
    env_file: [./memecoin_detecting/.env]
    network_mode: host
    depends_on: { db: { condition: service_healthy } }
    command: ["python3", "classifier_worker.py"]

  maintenance-worker:
    build: { context: ./memecoin_detecting, dockerfile: docker/Dockerfile }
    restart: always
    env_file: [./memecoin_detecting/.env]
    network_mode: host
    depends_on: { db: { condition: service_healthy } }
    command: ["python3", "maintenance_worker.py"]

volumes:
  pgdata:
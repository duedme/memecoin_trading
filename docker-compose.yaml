services:
  # ===== Postgres + TimescaleDB =====
  db:
    image: timescale/timescaledb:latest-pg16
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./memecoin_detecting/scripts/setup_memecoins_db.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ===== Detector de tokens =====
  detector:
    build:
      context: ./memecoin_detecting
      dockerfile: docker/Dockerfile
    restart: always
    env_file: ./memecoin_detecting/.env
    environment:
      - DB_HOST=db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command: ["python3", "detector_memecoins.py"]

  # ===== Collector de métricas =====
  metrics_collector:
    build:
      context: ./memecoin_detecting
      dockerfile: docker/Dockerfile
    restart: always
    env_file: ./memecoin_detecting/.env
    environment:
      - DB_HOST=db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command: ["python3", "metrics_collector.py"]

  # ===== Tracker de wallets =====
  wallet-tracker:
    build:
      context: ./memecoin_detecting
      dockerfile: docker/Dockerfile
    restart: always
    env_file: ./memecoin_detecting/.env
    environment:
      - DB_HOST=db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command: ["python3", "enhanced_wallet_tracker.py"]

  # ===== Clasificador de wallets (loop) =====
  wallet_classifier:
    build:
      context: ./memecoin_detecting
      dockerfile: docker/Dockerfile
    restart: always
    env_file: ./memecoin_detecting/.env
    environment:
      - DB_HOST=db
      - CLASSIFIER_LOOP_INTERVAL=1800
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /var/log/memecoin:/var/log/memecoin
    command:
      - sh
      - -c
      - |
        while true; do
          python3 wallet_classifier.py >> /var/log/memecoin/wallet_classifier.log 2>&1
          sleep "$CLASSIFIER_LOOP_INTERVAL"
        done

  # ===== API =====
  api-server:
    build:
      context: ./interface/backend
      dockerfile: Dockerfile
    restart: always
    env_file: ./memecoin_detecting/.env
    environment:
      - DB_HOST=db
    ports:
      - "8200:8200"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

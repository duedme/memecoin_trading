services:

#-----Postgres-----
  db:
    image: timescale/timescaledb:latest-pg16
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./memecoin_detecting/scripts/setup_memecoins_db.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

#-----Servidor---
  detector:
    build:
      context: ./memecoin_detecting
      dockerfile: docker/Dockerfile
    restart: always
    env_file: ./memecoin_detecting/.env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    command: ["python3", "detector_memecoins.py"]

  metrics_collector:
    build:
      context: ./memecoin_detecting
      dockerfile: docker/Dockerfile
    restart: always
    env_file: ./memecoin_detecting/.env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    command: ["python3", "metrics_collector.py"]

  wallet-tracker:
    build:
      context: ./memecoin_detecting
      dockerfile: docker/Dockerfile
    restart: always
    env_file: ./memecoin_detecting/.env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    command: ["python3", "enhanced_wallet_tracker.py"]

  wallet_classifier:
    build:
      context: ./memecoin_detecting
      dockerfile: docker/Dockerfile
    restart: always
    env_file: ./memecoin_detecting/.env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "while true; do python3 walletclassifier.py; sleep 1800; done"

#-----Backend----
  api-server:
    build:
      context: ./interface/backend
      dockerfile: Dockerfile
    restart: always
    env_file: ./memecoin_detecting/.env
    environment:
      - DB_HOST=db
    ports:
      - "8200:8200"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
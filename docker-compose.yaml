services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./memecoin_detecting/scripts/setup_memecoins_db.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  token-sync:
    build:
      context: ./memecoin_detecting
      dockerfile: docker/Dockerfile
    restart: always
    env_file: ./memecoin_detecting/.env
    environment:
      - DB_HOST=db
    depends_on:
      db: { condition: service_healthy }
    command: ["python3", "birdeye_token_sync.py"]

  top-traders-sync:
    build:
      context: ./memecoin_detecting
      dockerfile: docker/Dockerfile
    restart: always
    env_file: ./memecoin_detecting/.env
    environment:
      - DB_HOST=db
    depends_on:
      db: { condition: service_healthy }
    command: ["python3", "birdeye_top_traders_sync.py"]

  wallet-sync:
    build:
      context: ./memecoin_detecting
      dockerfile: docker/Dockerfile
    restart: always
    env_file: ./memecoin_detecting/.env
    environment:
      - DB_HOST=db
    depends_on:
      db: { condition: service_healthy }
    command: ["python3", "birdeye_wallet_sync.py"]

  wallet-classifier:
    build:
      context: ./memecoin_detecting
      dockerfile: docker/Dockerfile
    restart: always
    env_file: ./memecoin_detecting/.env
    environment:
      - DB_HOST=db
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "while true; do python3 wallet_classifier.py; sleep 1800; done"

  api-server:
    build:
      context: ./interface/backend
      dockerfile: Dockerfile
    restart: always
    env_file: ./memecoin_detecting/.env
    environment:
      - DB_HOST=db
    ports:
      - "8200:8200"
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata: